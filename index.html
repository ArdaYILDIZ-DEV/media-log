<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>media-log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0e0e0e;
  --surface: #161616;
  --border:  #2a2a2a;
  --text:    #d4cfc8;
  --muted:   #6b6560;
  --accent:  #c8a97e;
  --anime:   #7eb8c8;
  --film:    #c87e9a;
  --show:    #9ac87e;
}

html { font-size: 16px; }

body {
  font-family: 'EB Garamond', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.7;
}

a { color: inherit; text-decoration: none; }

/* ── header ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 2rem 0 1.5rem;
  margin-bottom: 3rem;
}
.header-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1.5rem;
  display: flex;
  align-items: baseline;
  gap: 1rem;
}
.site-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.site-subtitle {
  font-size: 0.9rem;
  color: var(--muted);
  font-style: italic;
}

/* ── main container ── */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1.5rem 5rem;
}

/* ── index: cards ── */
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 1.25rem;
}

.entries {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.entry-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 1.1rem 1.25rem;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.25rem 1rem;
  align-items: start;
  transition: border-color 0.15s, background 0.15s;
  cursor: pointer;
}
.entry-card:hover {
  border-color: var(--accent);
  background: #1a1a1a;
}
.entry-card:first-child { border-radius: 4px 4px 0 0; }
.entry-card:last-child  { border-radius: 0 0 4px 4px; }
.entry-card:only-child  { border-radius: 4px; }

.entry-title {
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
}
.entry-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.25rem;
}
.tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.15rem 0.45rem;
  border-radius: 2px;
}
.tag-anime  { background: #7eb8c812; color: var(--anime);  border: 1px solid #7eb8c830; }
.tag-film   { background: #c87e9a12; color: var(--film);   border: 1px solid #c87e9a30; }
.tag-show   { background: #9ac87e12; color: var(--show);   border: 1px solid #9ac87e30; }

.entry-score {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent);
}
.entry-status {
  font-size: 0.82rem;
  font-style: italic;
}
.status-watching  { color: #a78ee6; }
.status-finished  { color: #7ec89a; }
.status-dropped   { color: #c87e7e; }
.status-planned   { color: var(--muted); }
.entry-date {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}

/* ── entry page ── */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 2.5rem;
  transition: color 0.15s;
}
.back-link:hover { color: var(--accent); }

.entry-header { margin-bottom: 2rem; }
.entry-header h1 {
  font-size: 2rem;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 0.75rem;
  color: #e8e3db;
}
.entry-attrs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.25rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
}
.entry-attrs span { display: flex; gap: 0.35rem; }
.entry-attrs .key { color: var(--muted); }
.entry-attrs .val { color: var(--text); }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}

/* ── markdown body ── */
.entry-body h2 {
  font-size: 0.72rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 2rem 0 0.75rem;
}
.entry-body h3 {
  font-size: 1rem;
  font-weight: 500;
  margin: 1.25rem 0 0.4rem;
  color: var(--text);
}
.entry-body p {
  margin-bottom: 0.75rem;
  color: var(--text);
  font-size: 1.05rem;
}
.entry-body ul {
  padding-left: 1.25rem;
  margin-bottom: 0.75rem;
}
.entry-body li {
  color: var(--text);
  margin-bottom: 0.2rem;
  font-size: 1.05rem;
}
.entry-body code {
  font-family: 'DM Mono', monospace;
  font-size: 0.85em;
  background: #1f1f1f;
  padding: 0.1em 0.35em;
  border-radius: 2px;
  color: var(--accent);
}
.entry-body strong { color: #e8e3db; }

/* ── filters ── */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1.5rem;
  align-items: center;
}
.filter-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.3rem 0.7rem;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}
.filter-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: #c8a97e10;
}
.filter-divider {
  width: 1px;
  height: 1rem;
  background: var(--border);
  margin: 0 0.2rem;
}

/* ── responsive ── */
@media (max-width: 600px) {
  .entry-header h1 { font-size: 1.5rem; }
  .entry-card { grid-template-columns: 1fr; }
  .entry-date { text-align: left; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="site-title" href="/media-log/index.html">media-log</a>
    <span class="site-subtitle">film, anime, dizi notları</span>
  </div>
</header>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="anime">Anime</button>
    <button class="filter-btn" data-filter="film">Film</button>
    <button class="filter-btn" data-filter="show">Show</button>
    <span class="filter-divider"></span>
    <button class="filter-btn" data-filter="watching">Watching</button>
    <button class="filter-btn" data-filter="finished">Finished</button>
    <button class="filter-btn" data-filter="dropped">Dropped</button>
    <button class="filter-btn" data-filter="planned">Planned</button>
  </div>
  <div class="section-label">recent entries — <span id="count">4</span> total</div>
  <div class="entries">
<a href="animes/sentenced-to-be-a-hero.html" class="entry-card" data-type="anime" data-status="watching">
  <div>
    <div class="entry-title">Sentenced to Be a Hero</div>
    <div class="entry-meta">
      <span class="tag tag-anime">Anime</span>
      <span class="entry-score">10/10</span>
      <span class="entry-status status-watching">Watching</span>
    </div>
  </div>
  <div class="entry-date">30 Mar 2026</div>
</a>
<a href="films/project-hail-mary.html" class="entry-card" data-type="film" data-status="planned">
  <div>
    <div class="entry-title">Project Hail Mary</div>
    <div class="entry-meta">
      <span class="tag tag-film">Film</span>
      
      <span class="entry-status status-planned">Planned</span>
    </div>
  </div>
  <div class="entry-date">30 Mar 2026</div>
</a>
<a href="shows/the-umbrella-academy.html" class="entry-card" data-type="show" data-status="dropped">
  <div>
    <div class="entry-title">The Umbrella Academy</div>
    <div class="entry-meta">
      <span class="tag tag-show">Show</span>
      
      <span class="entry-status status-dropped">Dropped</span>
    </div>
  </div>
  <div class="entry-date">27 Feb 2026</div>
</a>
<a href="shows/arcane.html" class="entry-card" data-type="show" data-status="finished">
  <div>
    <div class="entry-title">Arcane</div>
    <div class="entry-meta">
      <span class="tag tag-show">Show</span>
      <span class="entry-score">10/10</span>
      <span class="entry-status status-finished">Finished</span>
    </div>
  </div>
  <div class="entry-date">15 Feb 2026</div>
</a>
  </div>
</div>
<script>
const btns = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.entry-card');
btns.forEach(btn => {
  btn.addEventListener('click', () => {
    btns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    let visible = 0;
    cards.forEach(card => {
      const type = card.dataset.type;
      const status = card.dataset.status;
      const show = f === 'all' || type === f || status === f;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('count').textContent = visible;
  });
});
</script>
</body>
</html>
